spring:
  application:
    name: meldehub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meldehub}
    username: ${DB_USER:meldehub}
    password: ${DB_PASSWORD:meldehub}
  jpa:
    hibernate:
      ddl-auto: validate   # şemayı Flyway kurar (db/migration), Hibernate sadece doğrular (ADR-0005 borcu kapandı)
  flyway:
    enabled: true          # V1__init.sql ilk açılışta tabloyu oluşturur
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: meldehub-routing
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: mesaj OKUMA (deserialize) hatasında bile consumer
      # kilitlenmez; hata, CommonErrorHandler'a (retry + DLQ) teslim edilir (CASE-244).
      # Önceki hali (çıplak JsonDeserializer): zehirli mesaj offset'te sonsuz döngü → kuyruk bloke.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ch.meldehub.events

app:
  kafka:
    case-created-topic: case-created   # topic adı config'den — koda gömülmez
  jwt:
    # GELİŞTİRME değeri — PRODUCTION'DA MUTLAKA JWT_SECRET env değişkeni ile değiştir!
    # HS256 için en az 32 bayt gerekir; kısa secret uygulama açılışında patlar (fail fast).
    secret: ${JWT_SECRET:meldehub-dev-only-secret-change-in-production-7f3a9c}
    validity-hours: 8                  # refresh token yok — bilinçli demo kararı (ADR-0009)

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
