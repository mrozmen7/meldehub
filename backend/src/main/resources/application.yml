spring:
  application:
    name: meldehub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meldehub}
    username: ${DB_USER:meldehub}
    password: ${DB_PASSWORD:meldehub}
  jpa:
    hibernate:
      ddl-auto: update   # iskelet aşaması; Flyway migration Faz 11'de (ADR-0005)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: meldehub-routing
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ch.meldehub.events

app:
  kafka:
    case-created-topic: case-created   # topic adı config'den — koda gömülmez

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
