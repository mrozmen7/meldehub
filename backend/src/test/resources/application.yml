# Test profili — GERÇEK PostgreSQL yerine bellek içi H2.
# İlke: testler dış bağımlılık istemez; CI'da sıfır kurulumla koşar.
# NOT: bu dosya main application.yml'in ÜZERİNE YAZAR (birleşmez) —
# app.* anahtarları burada da olmalı.
spring:
  datasource:
    url: jdbc:h2:mem:meldehub-test
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    # Test stratejisi (b): Flyway testte KAPALI, şema create-drop ile kurulur.
    # Gerekçe: test ilkesi "dış bağımlılık istemez"; H2'de migration koşturmak
    # PostgreSQL şemasını doğrulamaz (sahte güven + dialect drift riski).
    # Migration'ın gerçek doğrulaması docker-compose'taki gerçek PostgreSQL'de yapılır.
    enabled: false
  kafka:
    # @EmbeddedKafka varsa broker adresini test enjekte eder; yoksa localhost
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: meldehub-routing
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ch.meldehub.events

app:
  kafka:
    case-created-topic: case-created
  jwt:
    # Test secret — main application.yml yerine BU dosya yüklendiği için burada da olmalı
    secret: meldehub-test-secret-0123456789abcdef0123456789
    validity-hours: 8
