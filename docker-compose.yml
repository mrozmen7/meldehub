name: meldehub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meldehub
      POSTGRES_USER: meldehub
      POSTGRES_PASSWORD: meldehub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Host'a port AÇILMAZ — sadece compose ağı içinden erişilir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meldehub -d meldehub"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    # Tek node KRaft (ZooKeeper'sız) — resmi Apache imajı
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # apache/kafka imajı sabit bir cluster id ister (KRaft format adımı)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # Host'a port AÇILMAZ — container içi listener: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/meldehub
      DB_USER: meldehub
      DB_PASSWORD: meldehub
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # JWT imzalama anahtarı (CASE-201) — DEMO değeri; production'da
      # gerçek bir secret ile değiştir (ör. docker secret / vault)
      JWT_SECRET: meldehub-compose-dev-secret-change-in-production-4b8e1d
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
