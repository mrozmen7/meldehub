# MeldeHub production nginx konfigi (ADR-0007 — tek origin)
#
# Frontend statik dosyaları aynı origin'den servis edilir; /api istekleri
# backend konteynerine proxy'lenir. Tarayıcı tek origin görür → CORS gerekmez.
# Dev ortamındaki proxy.conf.json (Faz 10) ile aynı mental model.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API istekleri → backend konteyneri (compose servis adı: backend)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI JSON — Swagger dokümantasyonu da aynı origin'den erişilebilir
    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Swagger UI
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback: bilinmeyen yollar Angular router'a düşer
    location / {
        try_files $uri $uri/ /index.html;
    }
}
